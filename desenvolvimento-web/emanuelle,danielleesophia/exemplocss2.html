<!DOCTYPE html>
<html>

    <head>
        <style>
            p.one{
                border-style: solid;
                border-color: red;
                border-width: 20px;
             
                }

        </style>
    </head>
    <body>
        <!--O atributo class permite que você atribua uma ou mais classes a um elemento
         Essas classes são usadas como seletores em CSS e JavaScript para aplicar estilos ou
        comportamentos específicos ao elemento ou a um grupo de elementos que
        compartilham a mesma classe. -->
        <p class="one">Uma borda solida vermelha </p>
    </body>
</html>

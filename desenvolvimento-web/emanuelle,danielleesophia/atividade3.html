<!DOCTYPE html >
<html lang="pt-br">
<head>
	<meta charset=utf-8>
	<title>Floaten met dozen</title>
	<style>
	.box{
		width:80px;
		height:80px;
	}
	#box-1{
		background-color:#f00; /* red */
	}
	#box-2{
		background-color:#0f0; /* green */
	}
	#box-3{
		background-color:#00f; /* blue */
	}
	</style>
</head>
<body>
	<div id="box-1" class="box"></div>
	<div id="box-2" class="box"></div>
	<div id="box-3" class="box"></div>
</body>
</html>

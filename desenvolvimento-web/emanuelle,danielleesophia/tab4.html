<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Tabelas Lado a Lado</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px;
      background-color: #f2f2f2;
    }

    .container {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    table {
      border-collapse: collapse;
      width: 45%;
      background-color: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    th, td {
      border: 1px solid #ccc;
      padding: 12px;
      text-align: left;
    }

    th {
      background-color: #007bff;
      color: white;
    }

    caption {
      caption-side: top;
      font-weight: bold;
      margin-bottom: 10px;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Tabela Esquerda -->
    <table>
      <caption>Tabela Esquerda</caption>
      <tr>
        <th>Nome</th>
        <th>Idade</th>
      </tr>
      <tr>
        <td>João</td>
        <td>30</td>
      </tr>
      <tr>
        <td>Maria</td>
        <td>25</td>
      </tr>
    </table>

    <!-- Tabela Direita -->
    <table>
      <caption>Tabela Direita</caption>
      <tr>
        <th>Produto</th>
        <th>Preço</th>
      </tr>
      <tr>
        <td>Camisa</td>
        <td>R$ 49,90</td>
      </tr>
      <tr>
        <td>Calça</td>
        <td>R$ 89,90</td>
      </tr>
    </table>
  </div>

</body>
</html>

<!DOCTYPE html >
<html lang="pt-br">
<head>
<meta charset=utf-8>
<title>Floaten met dozen</title>
<style>
.quadrado{ 
width:100px;
height:100px;
}
#quadrado-2{
background-color:rgb(0, 0, 0);
margin-top: 10px; /* tag para recuo para baixo da parte inicial da página*/
margin-left: 10px; /* tag para recuo para a esquerda*/
margin-bottom: 20px; /* tag para espaço entre os containers*/
}
#quadrado-3{
background-color:rgb(81, 7, 255);
margin-left:10px;
margin-bottom: 20px;
float: right; /* arrastar tags para a direita*/
transform:translatey(-120%);

}
#quadrado-4{
background-color:rgb(255, 83, 232);
margin-left: 10px;
margin-bottom: 20px;
}
#quadrado-5{
background-color:rgb(255, 123, 46);
left: 800%;
margin-bottom: 20px;
transform:translatey(-122%); /* tag para aumentar o recuo para cima do container*/
float: right;
}

</style>
</head>
<body>
<div id="quadrado-2" class="quadrado"></div>
<div id="quadrado-3" class="quadrado"></div>
<div id="quadrado-4" class="quadrado"></div>
<div id="quadrado-5" class="quadrado"></div>
</body>
</html>

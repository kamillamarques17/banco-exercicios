<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animação de Fundo</title>
    <style>
        body {
         margin: 0;
         height: 100vh;
         display: flex;
         justify-content: center;
         align-items: center;
         animation: FundoColorido 5s infinite alternate;
        
        }

        @keyframes FundoColorido {
    0%  {background-color: #85898c;}
    50%  {background-color: #9aa3ad;}
    75%  {background-color: #bacadb;}
    100%  {background-color: #a6c2e3;}
        }

        .caixa {
         width: 150px;
         height: 150px;
         background-color: white;
         border-radius: 10px;
         box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="caixa"></div>
</body>
</html>

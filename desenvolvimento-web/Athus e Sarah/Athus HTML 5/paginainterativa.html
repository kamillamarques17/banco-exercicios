<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Interativa</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        background-color:#fff;
    }
    .menu {
        background-color: #f2e9dc;
        padding: 15px 0;
        text-align: center;
    }
    .menu2 {
        color: #802d2d;
        text-decoration: none;
        margin: 0 15px;
        font-weight: bold;
        font-size: 10px;
        transition: background-color 0.3s;
        padding: 10px 15px;
        border-radius: 5px;
    }

</style>
</head>
<body>
    <div class="menu"></div>
    <div class="menu2"></div>
</body>
</html>
